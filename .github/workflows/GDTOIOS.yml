name: Build Unsigned iOS IPA using GODOT game!

on:
  workflow_dispatch:
    inputs:
      game_repository:
        description: "Private game repository (owner/repository)"
        required: true
        default: "SlyDevil6858/myprivaterepo"
        type: string
      decompiled_folder:
        description: "Folder containing the decompiled Godot project (relative to the game repository root)"
        required: true
        default: "DEWDROP"
        type: string
      build_number:
        description: "iOS build number shown in-game and stored in the IPA"
        required: true
        default: 1
        type: number
      support_url:
        description: "Optional HTTPS/HTTP webpage opened by the in-game Support button"
        required: false
        default: "https://ko-fi.com/slydevil6858"
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare Decompiled Godot Project
    runs-on: windows-latest

    outputs:
      godot_minor: ${{ steps.version.outputs.godot_minor }}

    steps:
      - name: Download private game repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.game_repository }}
          token: ${{ secrets.GAME_REPO_TOKEN }}
          lfs: true
          path: game-source

      - name: Stage existing decompiled Godot project
        shell: pwsh
        run: |
          $repoRoot = Join-Path $env:GITHUB_WORKSPACE "game-source"
          $decompiledPath = Join-Path $repoRoot "${{ inputs.decompiled_folder }}"

          if (!(Test-Path $decompiledPath -PathType Container)) {
            throw "Decompiled folder not found: $decompiledPath"
          }

          $projectFile = Join-Path $decompiledPath "project.godot"
          if (!(Test-Path $projectFile -PathType Leaf)) {
            throw "No project.godot found in decompiled folder: $decompiledPath"
          }

          New-Item -ItemType Directory -Force recovered | Out-Null
          Get-ChildItem -LiteralPath $decompiledPath -Force | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination "recovered" -Recurse -Force
          }

          Write-Host "Staged the existing decompiled Godot project at $decompiledPath. No recovery or decryption is performed."

      - name: Prepare uploaded iOS app icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing

          $source = Join-Path "game-source" "${{ inputs.decompiled_folder }}\IOS_ICON.png"
          if (!(Test-Path $source -PathType Leaf)) {
            throw "Required app icon not found: $source"
          }

          $sourceImage = [System.Drawing.Image]::FromFile($source)
          try {
            $side = [Math]::Min($sourceImage.Width, $sourceImage.Height)
            $cropX = [int](($sourceImage.Width - $side) / 2)
            $cropY = [int](($sourceImage.Height - $side) / 2)

            # iOS requires a 1024x1024 app icon. Convert the supplied PNG to
            # an opaque RGB PNG and center-crop only if the source isn't square.
            $bitmap = New-Object System.Drawing.Bitmap(
              1024, 1024,
              [System.Drawing.Imaging.PixelFormat]::Format24bppRgb
            )
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.InterpolationMode = "HighQualityBicubic"
            $graphics.SmoothingMode = "HighQuality"
            $graphics.PixelOffsetMode = "HighQuality"
            $graphics.DrawImage(
              $sourceImage,
              [System.Drawing.Rectangle]::new(0, 0, 1024, 1024),
              [System.Drawing.Rectangle]::new($cropX, $cropY, $side, $side),
              [System.Drawing.GraphicsUnit]::Pixel
            )
            $bitmap.Save(
              "$env:GITHUB_WORKSPACE\recovered\icon.png",
              [System.Drawing.Imaging.ImageFormat]::Png
            )
            $graphics.Dispose()
            $bitmap.Dispose()
          }
          finally {
            $sourceImage.Dispose()
          }

          $project = "recovered/project.godot"
          $lines = [System.Collections.Generic.List[string]]::new()
          (Get-Content $project) | ForEach-Object { $lines.Add($_) }

          $start = $lines.IndexOf("[application]")
          if ($start -lt 0) {
            $lines.Add("")
            $lines.Add("[application]")
            $start = $lines.Count - 1
          }

          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^\[') {
              $end = $i
              break
            }
          }

          $found = $false
          for ($i = $start + 1; $i -lt $end; $i++) {
            if ($lines[$i] -match '^config/icon=') {
              $lines[$i] = 'config/icon="res://icon.png"'
              $found = $true
              break
            }
          }
          if (!$found) {
            $lines.Insert($start + 1, 'config/icon="res://icon.png"')
          }
          Set-Content $project $lines -Encoding utf8

          Write-Host "Using DEWDROP/IOS_ICON.png as the iOS app icon (1024x1024 PNG)."

      - name: Add iOS export preset
        shell: pwsh
        run: |
          $sourcePreset = "game-source/ios-config/export_presets.cfg"
          $targetPreset = "recovered/export_presets.cfg"

          if (!(Test-Path $sourcePreset)) {
            throw "Missing ios-config/export_presets.cfg in game repository."
          }

          Copy-Item $sourcePreset $targetPreset -Force
          $presetText = Get-Content $targetPreset -Raw

          # This preset is committed as an LFS pointer in the game repository,
          # but the file is not covered by .gitattributes. Resolve the pointer
          # explicitly instead of silently replacing the real preset with a
          # minimal preset that Godot cannot export.
          if ($presetText.StartsWith("version https://git-lfs.github.com/spec/v1")) {
            Write-Host "Resolving ios-config/export_presets.cfg Git LFS object."
            $smudgeCommand = 'git -C game-source lfs smudge < game-source\ios-config\export_presets.cfg > recovered\export_presets.cfg'
            & cmd.exe /d /c $smudgeCommand
            if ($LASTEXITCODE -ne 0) {
              throw "Could not download the iOS export preset from Git LFS. Check GAME_REPO_TOKEN access to LFS objects."
            }
            $presetText = Get-Content $targetPreset -Raw
            if ($presetText.StartsWith("version https://git-lfs.github.com/spec/v1")) {
              throw "Git LFS returned a pointer instead of the actual iOS export preset."
            }
          }

          if ([string]::IsNullOrWhiteSpace($presetText) -or
              !$presetText.Contains("[preset.") -or
              !$presetText.Contains('platform="iOS"')) {
            throw "ios-config/export_presets.cfg must contain the real Godot iOS export preset. No fallback preset will be generated."
          }

          Write-Host "Using the original iOS export preset from ios-config/export_presets.cfg."
          Get-Content $targetPreset | Select-Object -First 12
      - name: Detect Godot version series
        id: version
        shell: pwsh
        run: |
          $project = Get-Content "recovered/project.godot" -Raw

          $match = [regex]::Match(
            $project,
            'config/features\s*=\s*PackedStringArray\("(\d+\.\d+)'
          )

          if (!$match.Success) {
            throw "Could not detect Godot version series from project.godot."
          }

          $minor = $match.Groups[1].Value

          if (!$minor.StartsWith("4.")) {
            throw "This workflow currently supports Godot 4.x only. Detected $minor."
          }

          "godot_minor=$minor" >> $env:GITHUB_OUTPUT

      - name: Upload recovered project
        uses: actions/upload-artifact@v4
        with:
          name: recovered-godot-project
          path: recovered/
          if-no-files-found: error
          retention-days: 7

  build-ios:
    name: Build Unsigned iOS IPA
    needs: prepare
    runs-on: xcode-27

    steps:
      - name: Download recovered project
        uses: actions/download-artifact@v4
        with:
          name: recovered-godot-project
          path: recovered

      - name: Install matching Godot version and templates
        shell: bash
        run: |
          set -euo pipefail

          # Keep the editor and export templates on the project's verified version.
          # Use direct release asset URLs: both the GitHub API and Godot's
          # download redirect service returned HTTP 403 on this runner.
          VERSION="4.2.2"
          RELEASE_URL="https://github.com/godotengine/godot/releases/download/${VERSION}-stable"

          curl --fail --location --retry 3 --retry-all-errors \
            "${RELEASE_URL}/Godot_v${VERSION}-stable_macos.universal.zip" \
            -o godot.zip

          curl --fail --location --retry 3 --retry-all-errors \
            "${RELEASE_URL}/Godot_v${VERSION}-stable_export_templates.tpz" \
            -o templates.tpz

          unzip -q godot.zip -d godot-app
          unzip -q templates.tpz -d templates

          GODOT_APP=$(find godot-app -name "Godot.app" -type d | head -n 1)

          if [ -z "$GODOT_APP" ]; then
            echo "Godot.app not found."
            exit 1
          fi

          GODOT_BIN="$GODOT_APP/Contents/MacOS/Godot"

          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/${VERSION}.stable"

          mkdir -p "$TEMPLATE_DIR"
          cp -R templates/templates/. "$TEMPLATE_DIR/"

          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          echo "GODOT_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Configure unsigned iOS export
        shell: bash
        env:
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          if [ -z "$IOS_BUNDLE_ID" ]; then
            echo "Set the IOS_BUNDLE_ID repository secret."
            exit 1
          fi

          python3 - <<'PY'
          import os, re
          from pathlib import Path

          path = Path("recovered/export_presets.cfg")
          text = path.read_text(encoding="utf-8")

          def replace_setting(text, key, value):
              pattern = rf'(?m)^{re.escape(key)}=.*$'
              replacement = f'{key}="{value}"'
              if re.search(pattern, text):
                  return re.sub(pattern, lambda _: replacement, text)
              return text

          text = replace_setting(
              text,
              "application/bundle_identifier",
              os.environ["IOS_BUNDLE_ID"]
          )

          # Godot 4.2.2 requires a non-empty 10-character Team ID
          # even when exporting an unsigned Xcode project. When no real
          # Apple team is configured, use a placeholder for project generation.
          # This does not sign the app or make it eligible for App Store upload.
          team_id = os.environ.get("APPLE_TEAM_ID", "").strip() or "A1B2C3D4E5"
          if not re.fullmatch(r"[A-Z0-9]{10}", team_id):
              raise SystemExit("APPLE_TEAM_ID must be a 10-character uppercase alphanumeric Team ID.")
          text = replace_setting(
              text,
              "application/app_store_team_id",
              team_id
          )

          # Use the project icon generated from DEWDROP/IOS_ICON.png.
          text = re.sub(
              r'(?m)^(icons/[^=]+)=.*$',
              r'\1=""',
              text
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Set iOS app version and build number
        id: configure
        shell: bash
        env:
          IOS_BUILD_NUMBER: ${{ inputs.build_number }}
          IOS_SUPPORT_URL: ${{ inputs.support_url }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlsplit

          build_number = os.environ["IOS_BUILD_NUMBER"].strip()
          support_url = os.environ.get("IOS_SUPPORT_URL", "").strip()

          if not build_number.isdigit() or int(build_number) < 1:
              raise SystemExit("Build number must be a positive whole number.")

          if support_url:
              parsed = urlsplit(support_url)
              try:
                  port = parsed.port
              except ValueError:
                  raise SystemExit("Support URL has an invalid port.")
              if (
                  parsed.scheme.lower() not in ("http", "https")
                  or not parsed.hostname
                  or parsed.username is not None
                  or parsed.password is not None
                  or any(ch.isspace() for ch in support_url)
                  or (port is not None and not 1 <= port <= 65535)
              ):
                  raise SystemExit("Support URL must be a valid HTTP or HTTPS webpage URL.")

          global_path = Path("recovered/UI/Singletons/Global.gd")
          global_text = global_path.read_text(encoding="utf-8")
          major = re.search(r'(?m)^var version\s*=\s*(\d+)\s*$', global_text)
          minor = re.search(r'(?m)^var minor_version\s*=\s*"([0-9]+(?:\.[0-9]+)*)"\s*$', global_text)
          if not major or not minor:
              raise SystemExit("Could not read version and minor_version from Global.gd.")
          game_version = major.group(1) + "." + minor.group(1)

          project_path = Path("recovered/project.godot")
          project_lines = project_path.read_text(encoding="utf-8").splitlines()
          if "[application]" not in project_lines:
              raise SystemExit("project.godot has no [application] section.")
          app_start = project_lines.index("[application]")
          app_end = next(
              (i for i in range(app_start + 1, len(project_lines)) if project_lines[i].startswith("[")),
              len(project_lines)
          )
          settings = {
              "config/ios_build_number": build_number,
              "config/support_url": json.dumps(support_url),
          }
          for key, value in settings.items():
              line = key + "=" + value
              existing = next(
                  (i for i in range(app_start + 1, app_end) if project_lines[i].startswith(key + "=")),
                  None
              )
              if existing is None:
                  project_lines.insert(app_end, line)
                  app_end += 1
              else:
                  project_lines[existing] = line
          project_path.write_text("\n".join(project_lines) + "\n", encoding="utf-8")

          preset_path = Path("recovered/export_presets.cfg")
          preset_lines = preset_path.read_text(encoding="utf-8").splitlines()
          preset_index = None
          preset_name = None

          for i, header in enumerate(preset_lines):
              match = re.fullmatch(r"\[preset\.(\d+)\]", header)
              if not match:
                  continue
              section_end = next(
                  (j for j in range(i + 1, len(preset_lines)) if preset_lines[j].startswith("[")),
                  len(preset_lines)
              )
              section = "\n".join(preset_lines[i + 1:section_end])
              name_match = re.search(r'(?m)^name\s*=\s*"([^"]+)"\s*$', section)
              platform_match = re.search(r'(?m)^platform\s*=\s*"([^"]+)"\s*$', section)
              if name_match and (
                  (platform_match and platform_match.group(1).lower() == "ios")
                  or name_match.group(1).lower() == "ios"
              ):
                  preset_index = match.group(1)
                  preset_name = name_match.group(1)
                  break

          if preset_index is None:
              found = [
                  line.strip() for line in preset_lines
                  if line.startswith("name=") or line.startswith("platform=")
              ]
              raise SystemExit("No iOS export preset found. Available entries: " + repr(found))

          options_header = "[preset." + preset_index + ".options]"
          if options_header not in preset_lines:
              raise SystemExit("The iOS export preset has no options section.")

          options_start = preset_lines.index(options_header) + 1
          options_end = next(
              (i for i in range(options_start, len(preset_lines)) if preset_lines[i].startswith("[")),
              len(preset_lines)
          )
          # Ensure required iOS identity fields exist even when the original
          # export preset omitted them. The earlier replacement only changed
          # existing keys, which left Godot's Team ID validation unsatisfied.
          bundle_id = os.environ["IOS_BUNDLE_ID"].strip()
          team_id = os.environ.get("APPLE_TEAM_ID", "").strip() or "A1B2C3D4E5"
          if not re.fullmatch(r"[A-Z0-9]{10}", team_id):
              raise SystemExit("APPLE_TEAM_ID must be a 10-character uppercase alphanumeric Team ID.")
          for key, value in (
              ("application/bundle_identifier", bundle_id),
              ("application/app_store_team_id", team_id),
              ("application/short_version", game_version),
              ("application/version", build_number),
          ):
              setting = key + "=" + json.dumps(value)
              existing = next(
                  (i for i in range(options_start, options_end) if preset_lines[i].startswith(key + "=")),
                  None
              )
              if existing is None:
                  preset_lines.insert(options_end, setting)
                  options_end += 1
              else:
                  preset_lines[existing] = setting

          preset_path.write_text("\n".join(preset_lines) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("game_version=" + game_version + "\n")
              output.write("ios_preset_name=" + preset_name + "\n")

          print("iOS export preset: " + preset_name)
          print("iOS marketing version: " + game_version)
          print("iOS build number: " + build_number)
          PY

      - name: Prepare GodotSteam compatibility for iOS
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          project = Path("recovered/project.godot")
          text = project.read_text(encoding="utf-8")

          # The recovered addon contains Windows binaries only, while its
          # descriptor also references missing macOS and Linux libraries.
          # Steamworks is desktop-only for this iOS build.
          addon = Path("recovered/addons/godotsteam")
          if addon.exists():
              shutil.rmtree(addon)

          stub = Path("recovered/ios_steam_stub.gd")
          stub.write_text(
              "extends Node\n\n"
              "# Local iOS achievement storage; this does not connect to Steam.\n"
              "const SAVE_PATH := \"user://ios_achievements.cfg\"\n"
              "var achievements: Dictionary = {}\n\n"
              "func _ready() -> void:\n"
              "    var config := ConfigFile.new()\n"
              "    if config.load(SAVE_PATH) == OK:\n"
              "        achievements = config.get_value(\"achievements\", \"unlocked\", {})\n\n"
              "func steamInit() -> void:\n"
              "    pass\n\n"
              "# Return true so the game's Steam-dependent startup check does not abort.\n"
              "# This means the local compatibility layer is active, not that Steam is running.\n"
              "func isSteamRunning() -> bool:\n"
              "    return true\n\n"
              "func getAchievement(achievement_name: String) -> Dictionary:\n"
              "    return {\"achieved\": bool(achievements.get(achievement_name, false))}\n\n"
              "func setAchievement(achievement_name: String) -> void:\n"
              "    achievements[achievement_name] = true\n\n"
              "func storeStats() -> void:\n"
              "    var config := ConfigFile.new()\n"
              "    config.set_value(\"achievements\", \"unlocked\", achievements)\n"
              "    var error := config.save(SAVE_PATH)\n"
              "    if error != OK:\n"
              "        push_error(\"Could not save local iOS achievements: %s\" % error)\n",
              encoding="utf-8"
          )

          autoload = re.search(r"(?ms)^\[autoload\]\s*\n(.*?)(?=^\[|\Z)", text)
          if not autoload:
              raise SystemExit("project.godot has no [autoload] section.")

          section = autoload.group(1)
          steam_line = 'Steam="*res://ios_steam_stub.gd"'
          if re.search(r"(?m)^Steam\s*=", section):
              section = re.sub(r"(?m)^Steam\s*=.*$", steam_line, section)
          else:
              section = section.rstrip() + "\n" + steam_line + "\n"

          text = text[:autoload.start(1)] + section + text[autoload.end(1):]
          project.write_text(text, encoding="utf-8")
          print("Removed desktop GodotSteam binaries and registered the iOS Steam stub.")
          PY

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$GITHUB_WORKSPACE/recovered"

          # Build an isolated asset-only Godot project. The full project contains
          # scenes/resources that preload textures and audio during filesystem
          # scanning; those references were being parsed before their importers
          # had generated cache files. Importing in a clean project with only
          # source media prevents scripts, scenes, and .tres resources from
          # requesting assets during the importer bootstrap.
          ASSET_PROJECT_DIR="$GITHUB_WORKSPACE/asset-import"
          rm -rf "$PROJECT_DIR/.godot" "$ASSET_PROJECT_DIR"
          mkdir -p "$PROJECT_DIR/.godot" "$ASSET_PROJECT_DIR"

          cat > "$ASSET_PROJECT_DIR/project.godot" <<'EOF'
          config_version=5

          [application]
          config/name="Godot Asset Import"
          config/features=PackedStringArray("4.2")

          [rendering]
          renderer/rendering_method="gl_compatibility"
          EOF

          python3 - "$PROJECT_DIR" "$ASSET_PROJECT_DIR" <<'PY'
          import shutil
          import re
          import sys
          from pathlib import Path

          source = Path(sys.argv[1])
          target = Path(sys.argv[2])
          # Godot 4.2 built-in source media importers used by this project.
          importable = {
              ".png", ".jpg", ".jpeg", ".webp", ".svg", ".bmp", ".tga",
              ".dds", ".exr", ".hdr", ".ktx",
              ".wav", ".ogg", ".mp3", ".flac", ".aiff", ".aif",
              ".ttf", ".otf", ".woff", ".woff2",
              ".mp4", ".ogv", ".avi", ".mov",
          }
          counts = {}
          sidecar_count = 0
          for path in source.rglob("*"):
              if not path.is_file() or path.suffix.lower() not in importable:
                  continue
              relative = path.relative_to(source)
              destination = target / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(path, destination)
              suffix = path.suffix.lower()
              counts[suffix] = counts.get(suffix, 0) + 1

              # The source project commits per-file importer settings and UIDs.
              # Preserve them so textures/audio use the same Godot importers and
              # parameters instead of relying on defaults in the temporary project.
              source_sidecar = path.with_name(path.name + ".import")
              if source_sidecar.is_file():
                  sidecar_destination = destination.with_name(destination.name + ".import")
                  sidecar_text = source_sidecar.read_text(encoding="utf-8")
                  source_uri = "res://" + relative.as_posix()
                  sidecar_lines = sidecar_text.splitlines()
                  source_file_lines = [
                      index for index, line in enumerate(sidecar_lines)
                      if line.startswith("source_file=")
                  ]
                  if len(source_file_lines) != 1:
                      raise SystemExit(
                          f"Expected one source_file entry in {source_sidecar}, found {len(source_file_lines)}."
                      )
                  sidecar_lines[source_file_lines[0]] = 'source_file="' + source_uri + '"'
                  sidecar_destination.write_text("\n".join(sidecar_lines) + "\n", encoding="utf-8")
                  shutil.copystat(source_sidecar, sidecar_destination)
                  sidecar_count += 1

          if not counts:
              raise SystemExit("No importable source assets were staged.")
          if sidecar_count == 0:
              raise SystemExit("No source .import metadata was staged.")
          print("Staged source media by extension:")
          for suffix, count in sorted(counts.items()):
              print(f"  {suffix}: {count}")
          print("Total source media staged:", sum(counts.values()))
          print("Source .import sidecars staged:", sidecar_count)

          # Keep project-level importer defaults (notably texture defaults)
          # without copying autoloads or gameplay project settings.
          settings_path = source / "project.godot"
          if settings_path.is_file():
              settings = settings_path.read_text(encoding="utf-8")
              match = re.search(r"(?ms)^\[importer_defaults\]\s*\n.*?(?=^\[|\Z)", settings)
              if match:
                  with (target / "project.godot").open("a", encoding="utf-8") as project:
                      project.write("\n" + match.group(0).rstrip() + "\n")
                  print("Preserved project-level importer defaults.")
          PY

          IMPORT_LOG="$GITHUB_WORKSPACE/godot-import.log"

          # Godot 4.2's headless --import/--quit path can terminate before
          # EditorFileSystem finishes its first scan. Start the editor without
          # either quit flag and wait for every output named by the .import
          # sidecars to exist before stopping it.
          "$GODOT_BIN" \
            --headless \
            --editor \
            --verbose \
            --path "$ASSET_PROJECT_DIR" > "$IMPORT_LOG" 2>&1 &
          GODOT_PID=$!

          set +e
          python3 - "$ASSET_PROJECT_DIR" "$GODOT_PID" <<'PY'
          import os
          import re
          import signal
          import sys
          import time
          from pathlib import Path

          project = Path(sys.argv[1])
          godot_pid = int(sys.argv[2])
          imported = project / ".godot" / "imported"
          expected = set()

          for sidecar in project.rglob("*.import"):
              content = sidecar.read_text(encoding="utf-8", errors="replace")
              match = re.search(r"(?ms)^dest_files\s*=\s*\[(.*?)\]", content)
              if match:
                  expected.update(re.findall(r'"res://([^"]+)"', match.group(1)))

          if not expected:
              print("No expected import outputs were found in staged sidecars.")
              os.kill(godot_pid, signal.SIGTERM)
              raise SystemExit(1)

          def output_exists(path):
              exact = project / path
              if exact.is_file():
                  return True
              # Rewriting stale source_file URIs can change Godot's 32-character
              # import hash while retaining the asset filename and output type.
              match = re.match(r"^(.*)-[0-9a-f]{32}(\..+)$", Path(path).name)
              if not match:
                  return False
              stem, suffix = match.groups()
              return any(imported.glob(stem + "-*" + suffix))

          print("Waiting for Godot to generate", len(expected), "import outputs.")
          deadline = time.monotonic() + 900
          stable_since = None
          last_snapshot = None

          while time.monotonic() < deadline:
              missing = [path for path in expected if not output_exists(path)]
              if not missing:
                  files = list(imported.glob("*")) if imported.is_dir() else []
                  snapshot = (len(files), sum(p.stat().st_size for p in files if p.is_file()))
                  now = time.monotonic()
                  if snapshot == last_snapshot:
                      if stable_since is not None and now - stable_since >= 15:
                          print("All expected imports exist; cache remained stable for 15 seconds.")
                          os.kill(godot_pid, signal.SIGTERM)
                          raise SystemExit(0)
                  else:
                      last_snapshot = snapshot
                      stable_since = now
              else:
                  stable_since = None
                  last_snapshot = None

              try:
                  os.kill(godot_pid, 0)
              except ProcessLookupError:
                  break
              time.sleep(5)

          missing = [path for path in expected if not output_exists(path)]
          print("Godot import wait timed out or editor exited.")
          print("Expected outputs:", len(expected), "Missing outputs:", len(missing))
          for path in missing[:30]:
              print("MISSING:", path)
          try:
              os.kill(godot_pid, signal.SIGTERM)
          except ProcessLookupError:
              pass
          raise SystemExit(1)
          PY
          IMPORT_STATUS=$?
          set -e
          wait "$GODOT_PID" || true

          echo "Godot asset import completion status: $IMPORT_STATUS"
          echo "Godot asset import diagnostics:"
          grep -Ei '(^|[[:space:]])(ERROR|WARNING):|error:|failed|no loader|cannot open|parse error|invalid' "$IMPORT_LOG" | tail -n 120 || true
          echo "Godot asset import log: final 120 lines"
          tail -n 120 "$IMPORT_LOG"

          if [ "$IMPORT_STATUS" -ne 0 ]; then
            echo "Godot did not complete all expected asset imports."
            exit "$IMPORT_STATUS"
          fi

          IMPORTED_DIR="$ASSET_PROJECT_DIR/.godot/imported"
          if [ ! -d "$IMPORTED_DIR" ]; then
            echo "Godot did not create an asset import cache."
            exit 1
          fi

          # Transfer the generated cache and matching sidecars into the real
          # project without copying the temporary asset-only project settings.
          mkdir -p "$PROJECT_DIR/.godot/imported"
          cp -R "$IMPORTED_DIR/." "$PROJECT_DIR/.godot/imported/"
          python3 - "$ASSET_PROJECT_DIR" "$PROJECT_DIR" <<'PY'
          import shutil
          import sys
          from pathlib import Path

          source = Path(sys.argv[1])
          target = Path(sys.argv[2])
          sidecars = list(source.rglob("*.import"))
          for sidecar in sidecars:
              relative = sidecar.relative_to(source)
              destination = target / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(sidecar, destination)
          print("Transferred generated import sidecars:", len(sidecars))
          PY

          LOGO_IMPORT="$(find "$PROJECT_DIR/.godot/imported" -maxdepth 1 -type f \
            -name 'Firith_Bumper_Logo.png-*.ctex' -print -quit)"
          if [ -z "$LOGO_IMPORT" ] || [ ! -s "$LOGO_IMPORT" ]; then
            echo "Godot asset-only import did not create the Firith bumper logo texture."
            exit 1
          fi

          echo "Godot asset-only import cache verified. Imported files: $(find "$PROJECT_DIR/.godot/imported" -maxdepth 1 -type f | wc -l | tr -d ' ')"
          echo "Generated import sidecars: $(find "$PROJECT_DIR" -type f -name '*.import' | wc -l | tr -d ' ')"

      - name: Export iOS Xcode project
        shell: bash
        env:
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          mkdir -p ios-export

          # Re-assert the mandatory iOS identity settings immediately before
          # export. This guards against earlier preset edits or section parsing
          # leaving the Team ID out of the final options block.
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          path = Path("recovered/export_presets.cfg")
          lines = path.read_text(encoding="utf-8").splitlines()

          bundle_id = os.environ.get("IOS_BUNDLE_ID", "").strip()
          team_id = os.environ.get("APPLE_TEAM_ID", "").strip() or "A1B2C3D4E5"
          if not bundle_id:
              raise SystemExit("IOS_BUNDLE_ID is empty; set the repository secret.")
          if not re.fullmatch(r"[A-Z0-9]{10}", team_id):
              raise SystemExit("APPLE_TEAM_ID must be a 10-character uppercase alphanumeric Team ID.")

          ios_index = None
          for i, header in enumerate(lines):
              match = re.fullmatch(r"\[preset\.(\d+)\]", header)
              if not match:
                  continue
              end = next((j for j in range(i + 1, len(lines)) if lines[j].startswith("[")), len(lines))
              section = lines[i + 1:end]
              name = next((re.fullmatch(r'name="([^"]+)"', line).group(1)
                           for line in section if re.fullmatch(r'name="([^"]+)"', line)), "")
              platform = next((re.fullmatch(r'platform="([^"]+)"', line).group(1)
                               for line in section if re.fullmatch(r'platform="([^"]+)"', line)), "")
              if platform.lower() == "ios" or name.lower() == "ios":
                  ios_index = match.group(1)
                  break

          if ios_index is None:
              raise SystemExit("Could not find the iOS preset in export_presets.cfg.")

          options_header = f"[preset.{ios_index}.options]"
          if options_header not in lines:
              raise SystemExit(f"Missing {options_header} in export_presets.cfg.")
          start = lines.index(options_header) + 1
          end = next((i for i in range(start, len(lines)) if lines[i].startswith("[")), len(lines))

          required = {
              "application/bundle_identifier": bundle_id,
              "application/app_store_team_id": team_id,
          }
          for key, value in required.items():
              matches = [i for i in range(start, end) if lines[i].startswith(key + "=")]
              setting = key + "=" + json.dumps(value)
              if matches:
                  lines[matches[0]] = setting
                  for duplicate in reversed(matches[1:]):
                      del lines[duplicate]
                      end -= 1
              else:
                  lines.insert(end, setting)
                  end += 1

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          # Read back the exact options section and fail closed if either key
          # did not survive serialization.
          written = path.read_text(encoding="utf-8")
          section_match = re.search(
              rf"(?ms)^\[preset\.{ios_index}\.options\]\n(.*?)(?=^\[|\Z)",
              written
          )
          if not section_match:
              raise SystemExit("Could not read back the iOS options section.")
          for key in required:
              if not re.search(rf"(?m)^{re.escape(key)}=", section_match.group(1)):
                  raise SystemExit(f"Required iOS export setting was not written: {key}")
              print(f"Verified iOS export setting: {key}=<present>")
          PY

          echo "=== iOS export environment diagnostics ==="
          echo "Xcode selection:"
          xcode-select -p || true
          echo "Xcode version:"
          xcodebuild -version || true
          echo "iPhoneOS SDK:"
          xcrun --sdk iphoneos --show-sdk-path || true
          echo "Godot export template files:"
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/4.2.2.stable"
          find "$TEMPLATE_DIR" -maxdepth 2 -type f -print | sort || true
          echo "iOS preset options (identity values redacted):"
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("recovered/export_presets.cfg").read_text(encoding="utf-8")
          for line in text.splitlines():
              if line.startswith("[preset.") or line.startswith("name=") or line.startswith("platform="):
                  print(line)
              elif line.startswith(("application/", "architectures/", "icons/", "storyboard/")):
                  if any(key in line for key in ("bundle_identifier", "app_store_team_id")):
                      print(line.split("=", 1)[0] + '="<redacted>"')
                  else:
                      print(line)
          PY
          echo "=== End iOS export environment diagnostics ==="

          set +e
          "$GODOT_BIN" \
            --headless \
            --verbose \
            --path "$GITHUB_WORKSPACE/recovered" \
            --export-debug "${{ steps.configure.outputs.ios_preset_name }}" \
            "$GITHUB_WORKSPACE/ios-export/Game.zip" 2>&1 | tee ios-export/godot-export.log
          EXPORT_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$EXPORT_STATUS" -ne 0 ]; then
            echo "Godot iOS export failed with exit code $EXPORT_STATUS."
            echo "Relevant Godot export diagnostics:"
            grep -Ei 'ERROR:|WARNING:|invalid|missing|required|not found|failed|configuration|template|Team ID|bundle' ios-export/godot-export.log | tail -n 160 || true
            exit "$EXPORT_STATUS"
          fi

          if [ ! -f ios-export/Game.zip ]; then
            echo "Godot did not create the iOS export ZIP."
            exit 1
          fi

          mkdir -p ios-export/project
          unzip -q ios-export/Game.zip -d ios-export/project

      - name: Compile without code signing
        shell: bash
        run: |
          set -euo pipefail

          XCODEPROJ=$(find ios-export/project \
            -name "*.xcodeproj" -type d | head -n 1)

          if [ -z "$XCODEPROJ" ]; then
            echo "Xcode project not found."
            exit 1
          fi

          SCHEME=$(xcodebuild -list -json -project "$XCODEPROJ" |
            python3 -c '
          import json, sys
          schemes = json.load(sys.stdin)["project"]["schemes"]
          if not schemes:
              raise SystemExit("No Xcode schemes found.")
          print(schemes[0])
          ')

          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/ios-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        shell: bash
        env:
          IOS_BUILD_NUMBER: ${{ inputs.build_number }}
          GAME_VERSION: ${{ steps.configure.outputs.game_version }}
        run: |
          set -euo pipefail

          APP=$(find ios-build/Build/Products/Debug-iphoneos \
            -maxdepth 1 -name "*.app" -type d | head -n 1)

          if [ -z "$APP" ]; then
            echo "Compiled iOS app not found."
            exit 1
          fi

          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/

          IPA_NAME="DEWDROP_DYNASTY_A15_v${GAME_VERSION}_Build_${IOS_BUILD_NUMBER}.ipa"
          cd ipa
          zip -qr "$GITHUB_WORKSPACE/$IPA_NAME" Payload

          echo "Unsigned IPA created: $IPA_NAME"

      - name: Publish IPA to a private release in myprivaterepo
        uses: softprops/action-gh-release@v3
        with:
          repository: SlyDevil6858/myprivaterepo
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          tag_name: "dewdrop-ios-build-${{ github.run_id }}"
          name: "DEWDROP DYNASTY A15 v${{ steps.configure.outputs.game_version }} Build ${{ inputs.build_number }}"
          body: |
            Unsigned iOS build of Dewdrop Dynasty.

            Build number: ${{ inputs.build_number }}
            Support page: ${{ inputs.support_url }}

            This release is published privately in the Dewdrop Dynasty game repository.
          files: "DEWDROP_DYNASTY_A15_v${{ steps.configure.outputs.game_version }}_Build_${{ inputs.build_number }}.ipa"
          fail_on_unmatched_files: true
          make_latest: false
