name: Build Unsigned iOS IPA using GODOT game!

on:
  workflow_dispatch:
    inputs:
      game_repository:
        description: "Private game repository (owner/repository)"
        required: true
        default: "SlyDevil6858/myprivaterepo"
        type: string
      decompiled_folder:
        description: "Folder containing the decompiled Godot project (relative to the game repository root)"
        required: true
        default: "DEWDROP"
        type: string
      build_number:
        description: "iOS build number shown in-game and stored in the IPA"
        required: true
        default: 1
        type: number
      support_url:
        description: "Optional HTTPS/HTTP webpage opened by the in-game Support button"
        required: false
        default: "https://ko-fi.com/slydevil6858"
        type: string

permissions:
  contents: read

jobs:
  recover:
    name: Recover Godot Project
    runs-on: windows-latest

    outputs:
      godot_minor: ${{ steps.version.outputs.godot_minor }}

    steps:
      - name: Download private game repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.game_repository }}
          token: ${{ secrets.GAME_REPO_TOKEN }}
          lfs: true
          path: game-source

      - name: Check for decompiled Godot project
        id: source
        shell: pwsh
        run: |
          $repoRoot = Join-Path $env:GITHUB_WORKSPACE "game-source"
          $decompiledPath = Join-Path $repoRoot "${{ inputs.decompiled_folder }}"

          if (!(Test-Path $decompiledPath -PathType Container)) {
            throw "Decompiled folder not found: $decompiledPath"
          }

          $projectFile = Join-Path $decompiledPath "project.godot"
          if (!(Test-Path $projectFile -PathType Leaf)) {
            throw "No project.godot found in decompiled folder: $decompiledPath"
          }

          New-Item -ItemType Directory -Force recovered | Out-Null
          Get-ChildItem -LiteralPath $decompiledPath -Force | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination "recovered" -Recurse -Force
          }

          "use_existing=true" >> $env:GITHUB_OUTPUT
          Write-Host "Using the decompiled Godot project at $decompiledPath."

      - name: Install GDRE Tools
        if: steps.source.outputs.use_existing != 'true'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod https://get.scoop.sh | Invoke-Expression
          scoop bucket add games
          scoop install gdsdecomp

      - name: Locate game files
        if: steps.source.outputs.use_existing != 'true'
        id: game
        shell: pwsh
        run: |
          $source = Join-Path "game-source" "${{ inputs.game_folder }}"

          if (!(Test-Path $source)) {
            throw "Game folder not found: $source"
          }

          $pck = Get-ChildItem $source -Filter "*.pck" -Recurse |
            Select-Object -First 1

          $exe = Get-ChildItem $source -Filter "*.exe" -Recurse |
            Select-Object -First 1

          if ($pck) {
            "INPUT_FILE=$($pck.FullName)" >> $env:GITHUB_OUTPUT
          }
          elseif ($exe) {
            "INPUT_FILE=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          }
          else {
            throw "No EXE or PCK found."
          }

          if ($exe) {
            "EXE_FILE=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          }

      - name: Install gore
        if: steps.source.outputs.use_existing != 'true'
        shell: pwsh
        run: |
          $release = Invoke-RestMethod "https://api.github.com/repos/figurophobia/gore/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -eq "windows-x86_64.zip" } | Select-Object -First 1

          if (!$asset) {
            throw "Could not find the Windows x86_64 gore release asset."
          }

          $installDir = Join-Path $env:RUNNER_TEMP "gore"
          New-Item -ItemType Directory -Force $installDir | Out-Null

          $archive = Join-Path $env:RUNNER_TEMP "gore.zip"
          Invoke-WebRequest $asset.browser_download_url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $installDir -Force

          $gore = Get-ChildItem $installDir -Filter "gore.exe" -Recurse |
            Select-Object -First 1

          if (!$gore) {
            throw "gore.exe was not found in the downloaded release."
          }

          "GORE_EXE=$($gore.FullName)" >> $env:GITHUB_ENV
          Write-Host "Installed gore $($release.tag_name)"

      - name: Recover and decrypt Godot project with gore
        if: steps.source.outputs.use_existing != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force recovered | Out-Null

          $gdre = Join-Path $env:USERPROFILE "scoop\shims\gdre_tools.exe"
          if (!(Test-Path $gdre)) {
            throw "GDRE Tools executable not found at $gdre"
          }

          if (!(Test-Path $env:GORE_EXE)) {
            throw "gore executable not found at $env:GORE_EXE"
          }

          # gore searches the selected EXE/PCK for the embedded encryption key.
          # The key itself is not passed as an argument or written to the logs.
          & $env:GORE_EXE recover "${{ steps.game.outputs.INPUT_FILE }}" -o "$env:GITHUB_WORKSPACE\recovered" --gdre "$gdre"

          if ($LASTEXITCODE -ne 0) {
            throw "gore recovery failed with exit code $LASTEXITCODE."
          }

          if (!(Test-Path "recovered/project.godot")) {
            throw "gore did not produce recovered/project.godot."
          }

      - name: Extract original EXE icon
        if: steps.game.outputs.EXE_FILE != ''
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing

          $exePath = "${{ steps.game.outputs.EXE_FILE }}"
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exePath)

          if ($null -eq $icon) {
            throw "Could not extract the EXE icon."
          }

          $sourceBitmap = $icon.ToBitmap()

          $bitmap = New-Object System.Drawing.Bitmap(
            1024, 1024,
            [System.Drawing.Imaging.PixelFormat]::Format32bppArgb
          )

          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.Clear([System.Drawing.Color]::Transparent)
          $graphics.InterpolationMode = "HighQualityBicubic"
          $graphics.SmoothingMode = "HighQuality"
          $graphics.PixelOffsetMode = "HighQuality"

          $size = [Math]::Min($sourceBitmap.Width, $sourceBitmap.Height)
          $x = [int](($sourceBitmap.Width - $size) / 2)
          $y = [int](($sourceBitmap.Height - $size) / 2)

          $graphics.DrawImage(
            $sourceBitmap,
            [System.Drawing.Rectangle]::new(96, 96, 832, 832),
            [System.Drawing.Rectangle]::new($x, $y, $size, $size),
            [System.Drawing.GraphicsUnit]::Pixel
          )

          $bitmap.Save(
            "$env:GITHUB_WORKSPACE\recovered\icon.png",
            [System.Drawing.Imaging.ImageFormat]::Png
          )

          $graphics.Dispose()
          $bitmap.Dispose()
          $sourceBitmap.Dispose()
          $icon.Dispose()

          Write-Host "EXE icon extracted to recovered/icon.png"

      - name: Set recovered project icon
        if: steps.game.outputs.EXE_FILE != ''
        shell: pwsh
        run: |
          $project = "recovered/project.godot"
          $lines = [System.Collections.Generic.List[string]]::new()

          (Get-Content $project) | ForEach-Object {
            $lines.Add($_)
          }

          $start = $lines.IndexOf("[application]")

          if ($start -lt 0) {
            $lines.Add("")
            $lines.Add("[application]")
            $start = $lines.Count - 1
          }

          $end = $lines.Count

          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^\[') {
              $end = $i
              break
            }
          }

          $found = $false

          for ($i = $start + 1; $i -lt $end; $i++) {
            if ($lines[$i] -match '^config/icon=') {
              $lines[$i] = 'config/icon="res://icon.png"'
              $found = $true
              break
            }
          }

          if (!$found) {
            $lines.Insert($start + 1, 'config/icon="res://icon.png"')
          }

          Set-Content $project $lines -Encoding utf8

      - name: Prepare uploaded iOS app icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing

          $source = Join-Path "game-source" "${{ inputs.decompiled_folder }}\IOS_ICON.jpg"
          if (!(Test-Path $source -PathType Leaf)) {
            throw "Required app icon not found: $source"
          }

          $sourceImage = [System.Drawing.Image]::FromFile($source)
          try {
            $side = [Math]::Min($sourceImage.Width, $sourceImage.Height)
            $cropX = [int](($sourceImage.Width - $side) / 2)
            $cropY = [int](($sourceImage.Height - $side) / 2)

            # iOS requires a 1024x1024 app icon. Convert the supplied JPG to
            # an opaque RGB PNG and center-crop only if the source isn't square.
            $bitmap = New-Object System.Drawing.Bitmap(
              1024, 1024,
              [System.Drawing.Imaging.PixelFormat]::Format24bppRgb
            )
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.InterpolationMode = "HighQualityBicubic"
            $graphics.SmoothingMode = "HighQuality"
            $graphics.PixelOffsetMode = "HighQuality"
            $graphics.DrawImage(
              $sourceImage,
              [System.Drawing.Rectangle]::new(0, 0, 1024, 1024),
              [System.Drawing.Rectangle]::new($cropX, $cropY, $side, $side),
              [System.Drawing.GraphicsUnit]::Pixel
            )
            $bitmap.Save(
              "$env:GITHUB_WORKSPACE\recovered\icon.png",
              [System.Drawing.Imaging.ImageFormat]::Png
            )
            $graphics.Dispose()
            $bitmap.Dispose()
          }
          finally {
            $sourceImage.Dispose()
          }

          $project = "recovered/project.godot"
          $lines = [System.Collections.Generic.List[string]]::new()
          (Get-Content $project) | ForEach-Object { $lines.Add($_) }

          $start = $lines.IndexOf("[application]")
          if ($start -lt 0) {
            $lines.Add("")
            $lines.Add("[application]")
            $start = $lines.Count - 1
          }

          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^\[') {
              $end = $i
              break
            }
          }

          $found = $false
          for ($i = $start + 1; $i -lt $end; $i++) {
            if ($lines[$i] -match '^config/icon=') {
              $lines[$i] = 'config/icon="res://icon.png"'
              $found = $true
              break
            }
          }
          if (!$found) {
            $lines.Insert($start + 1, 'config/icon="res://icon.png"')
          }
          Set-Content $project $lines -Encoding utf8

          Write-Host "Using DEWDROP/IOS_ICON.jpg as the iOS app icon (1024x1024 PNG)."

      - name: Add iOS export preset
        shell: pwsh
        run: |
          $preset = "game-source/ios-config/export_presets.cfg"

          if (!(Test-Path $preset)) {
            throw "Missing ios-config/export_presets.cfg in game repository."
          }

          Copy-Item $preset "recovered/export_presets.cfg"

      - name: Detect Godot version series
        id: version
        shell: pwsh
        run: |
          $project = Get-Content "recovered/project.godot" -Raw

          $match = [regex]::Match(
            $project,
            'config/features\s*=\s*PackedStringArray\("(\d+\.\d+)'
          )

          if (!$match.Success) {
            throw "Could not detect Godot version series from project.godot."
          }

          $minor = $match.Groups[1].Value

          if (!$minor.StartsWith("4.")) {
            throw "This workflow currently supports Godot 4.x only. Detected $minor."
          }

          "godot_minor=$minor" >> $env:GITHUB_OUTPUT

      - name: Upload recovered project
        uses: actions/upload-artifact@v4
        with:
          name: recovered-godot-project
          path: recovered/
          if-no-files-found: error
          retention-days: 7

  build-ios:
    name: Build Unsigned iOS IPA
    needs: recover
    runs-on: xcode-27

    steps:
      - name: Download recovered project
        uses: actions/download-artifact@v4
        with:
          name: recovered-godot-project
          path: recovered

      - name: Install matching Godot version and templates
        shell: bash
        run: |
          set -euo pipefail

          MINOR="${{ needs.recover.outputs.godot_minor }}"

          RELEASES=$(curl -fsSL \
            "https://api.github.com/repos/godotengine/godot/releases?per_page=100")

          VERSION=$(echo "$RELEASES" | python3 -c '
          import json, sys

          minor = sys.argv[1]
          releases = json.load(sys.stdin)

          matches = [
              r["tag_name"].removesuffix("-stable")
              for r in releases
              if r.get("tag_name", "").startswith(minor + ".")
              and r.get("tag_name", "").endswith("-stable")
              and not r.get("prerelease", False)
          ]

          if not matches:
              raise SystemExit("No stable release found for " + minor)

          print(max(matches, key=lambda v: tuple(int(part) for part in v.split("."))))
          ' "$MINOR")

          BASE="https://github.com/godotengine/godot/releases/download/${VERSION}-stable"

          curl -fL "$BASE/Godot_v${VERSION}-stable_macos.universal.zip" \
            -o godot.zip

          curl -fL "$BASE/Godot_v${VERSION}-stable_export_templates.tpz" \
            -o templates.tpz

          unzip -q godot.zip -d godot-app
          unzip -q templates.tpz -d templates

          GODOT_APP=$(find godot-app -name "Godot.app" -type d | head -n 1)

          if [ -z "$GODOT_APP" ]; then
            echo "Godot.app not found."
            exit 1
          fi

          GODOT_BIN="$GODOT_APP/Contents/MacOS/Godot"

          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/${VERSION}.stable"

          mkdir -p "$TEMPLATE_DIR"
          cp -R templates/templates/. "$TEMPLATE_DIR/"

          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          echo "GODOT_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Configure unsigned iOS export
        shell: bash
        env:
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          if [ -z "$IOS_BUNDLE_ID" ]; then
            echo "Set the IOS_BUNDLE_ID repository secret."
            exit 1
          fi

          python3 - <<'PY'
          import os, re
          from pathlib import Path

          path = Path("recovered/export_presets.cfg")
          text = path.read_text(encoding="utf-8")

          def replace_setting(text, key, value):
              pattern = rf'(?m)^{re.escape(key)}=.*$'
              replacement = f'{key}="{value}"'
              if re.search(pattern, text):
                  return re.sub(pattern, lambda _: replacement, text)
              return text

          text = replace_setting(
              text,
              "application/bundle_identifier",
              os.environ["IOS_BUNDLE_ID"]
          )

          team_id = os.environ.get("APPLE_TEAM_ID", "")
          if team_id:
              text = replace_setting(
                  text,
                  "application/app_store_team_id",
                  team_id
              )

          # Use the project icon generated from DEWDROP/IOS_ICON.jpg.
          text = re.sub(
              r'(?m)^(icons/[^=]+)=.*$',
              r'\1=""',
              text
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Set iOS app version and build number
        shell: bash
        env:
          IOS_BUILD_NUMBER: ${{ inputs.build_number }}
          IOS_SUPPORT_URL: ${{ inputs.support_url }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          build_number = os.environ["IOS_BUILD_NUMBER"].strip()
          support_url = os.environ.get("IOS_SUPPORT_URL", "").strip()
          if support_url:
              parsed_support_url = urlsplit(support_url)
              try:
                  support_port = parsed_support_url.port
              except ValueError:
                  raise SystemExit("Support URL has an invalid port.")
              if (
                  parsed_support_url.scheme.lower() not in ("http", "https")
                  or not parsed_support_url.hostname
                  or parsed_support_url.username is not None
                  or parsed_support_url.password is not None
                  or any(character.isspace() for character in support_url)
                  or (support_port is not None and not 1 <= support_port <= 65535)
              ):
                  raise SystemExit("Support URL must be a valid HTTP or HTTPS webpage URL.")
          if not build_number.isdigit() or int(build_number) < 1:
              raise SystemExit("Build number must be a positive whole number.")

          global_lines = Path("recovered/UI/Singletons/Global.gd").read_text(encoding="utf-8").splitlines()
          values = {}
          for line in global_lines:
              if line.startswith("var version ="):
                  values["major"] = line.split("=", 1)[1].strip()
              elif line.startswith("var minor_version ="):
                  values["minor"] = line.split("=", 1)[1].strip().strip('"')
          if set(values) != {"major", "minor"}:
              raise SystemExit("Could not read version and minor_version from Global.gd.")
          game_version = values["major"] + "." + values["minor"]
          if not all(part.isdigit() for part in game_version.split(".")):
              raise SystemExit("Invalid game version: " + game_version)

          # Expose the selected build number to the iOS title-screen label.
          project_path = Path("recovered/project.godot")
          project_lines = project_path.read_text(encoding="utf-8").splitlines()
          app_start = project_lines.index("[application]") if "[application]" in project_lines else -1
          if app_start < 0:
              raise SystemExit("project.godot has no [application] section.")
          app_end = next((i for i in range(app_start + 1, len(project_lines)) if project_lines[i].startswith("[")), len(project_lines))
          settings_to_write = {
              "config/ios_build_number": build_number,
              "config/support_url": json.dumps(support_url),
          }
          for key, value in settings_to_write.items():
              setting = key + "=" + value
              found = False
              for i in range(app_start + 1, app_end):
                  if project_lines[i].startswith(key + "="):
                      project_lines[i] = setting
                      found = True
                      break
              if not found:
                  project_lines.insert(app_end, setting)
                  app_end += 1
          project_path.write_text("\n".join(project_lines) + "\n", encoding="utf-8")

          # Set the marketing version to the game version and the iOS build
          # version to the user-selected build number.
          preset_path = Path("recovered/export_presets.cfg")
          preset_lines = preset_path.read_text(encoding="utf-8").splitlines()
          ios_index = None
          for i, line in enumerate(preset_lines):
              if line.startswith("[preset.") and line.endswith("]") and not line.endswith(".options]"):
                  end = next((j for j in range(i + 1, len(preset_lines)) if preset_lines[j].startswith("[")), len(preset_lines))
                  if 'name="iOS"' in preset_lines[i + 1:end]:
                      ios_index = line[len("[preset."):-1]
                      break
          if ios_index is None:
              raise SystemExit("Could not find the iOS export preset.")
          header = "[preset." + ios_index + ".options]"
          if header not in preset_lines:
              raise SystemExit("The iOS export preset has no options section.")
          start = preset_lines.index(header) + 1
          end = next((j for j in range(start, len(preset_lines)) if preset_lines[j].startswith("[")), len(preset_lines))
          for key, value in (("application/short_version", game_version), ("application/version", build_number)):
              setting = key + '=\"' + value + '\"'
              found = False
              for i in range(start, end):
                  if preset_lines[i].startswith(key + "="):
                      preset_lines[i] = setting
                      found = True
                      break
              if not found:
                  preset_lines.insert(end, setting)
                  end += 1
          preset_path.write_text("\n".join(preset_lines) + "\n", encoding="utf-8")
          print("iOS marketing version: " + game_version)
          print("iOS build number: " + build_number)
          PY

      - name: Prepare GodotSteam compatibility for iOS
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          project = Path("recovered/project.godot")
          text = project.read_text(encoding="utf-8")

          # The recovered addon contains Windows binaries only, while its
          # descriptor also references missing macOS and Linux libraries.
          # Steamworks is desktop-only for this iOS build.
          addon = Path("recovered/addons/godotsteam")
          if addon.exists():
              shutil.rmtree(addon)

          stub = Path("recovered/ios_steam_stub.gd")
          stub.write_text(
              "extends Node\n\n"
              "# Local iOS achievement storage; this does not connect to Steam.\n"
              "const SAVE_PATH := \"user://ios_achievements.cfg\"\n"
              "var achievements: Dictionary = {}\n\n"
              "func _ready() -> void:\n"
              "    var config := ConfigFile.new()\n"
              "    if config.load(SAVE_PATH) == OK:\n"
              "        achievements = config.get_value(\"achievements\", \"unlocked\", {})\n\n"
              "func steamInit() -> void:\n"
              "    pass\n\n"
              "# Return true so the game's Steam-dependent startup check does not abort.\n"
              "# This means the local compatibility layer is active, not that Steam is running.\n"
              "func isSteamRunning() -> bool:\n"
              "    return true\n\n"
              "func getAchievement(achievement_name: String) -> Dictionary:\n"
              "    return {\"achieved\": bool(achievements.get(achievement_name, false))}\n\n"
              "func setAchievement(achievement_name: String) -> void:\n"
              "    achievements[achievement_name] = true\n\n"
              "func storeStats() -> void:\n"
              "    var config := ConfigFile.new()\n"
              "    config.set_value(\"achievements\", \"unlocked\", achievements)\n"
              "    var error := config.save(SAVE_PATH)\n"
              "    if error != OK:\n"
              "        push_error(\"Could not save local iOS achievements: %s\" % error)\n",
              encoding="utf-8"
          )

          autoload = re.search(r"(?ms)^\[autoload\]\s*\n(.*?)(?=^\[|\Z)", text)
          if not autoload:
              raise SystemExit("project.godot has no [autoload] section.")

          section = autoload.group(1)
          steam_line = 'Steam="*res://ios_steam_stub.gd"'
          if re.search(r"(?m)^Steam\s*=", section):
              section = re.sub(r"(?m)^Steam\s*=.*$", steam_line, section)
          else:
              section = section.rstrip() + "\n" + steam_line + "\n"

          text = text[:autoload.start(1)] + section + text[autoload.end(1):]
          project.write_text(text, encoding="utf-8")
          print("Removed desktop GodotSteam binaries and registered the iOS Steam stub.")
          PY

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail

          "$GODOT_BIN" \
            --headless \
            --editor \
            --path "$GITHUB_WORKSPACE/recovered" \
            --import

      - name: Export iOS Xcode project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ios-export

          "$GODOT_BIN" \
            --headless \
            --path "$GITHUB_WORKSPACE/recovered" \
            --export-debug "iOS" \
            "$GITHUB_WORKSPACE/ios-export/Game.zip"

          if [ ! -f ios-export/Game.zip ]; then
            echo "Godot did not create the iOS export ZIP."
            exit 1
          fi

          mkdir -p ios-export/project
          unzip -q ios-export/Game.zip -d ios-export/project

      - name: Compile without code signing
        shell: bash
        run: |
          set -euo pipefail

          XCODEPROJ=$(find ios-export/project \
            -name "*.xcodeproj" -type d | head -n 1)

          if [ -z "$XCODEPROJ" ]; then
            echo "Xcode project not found."
            exit 1
          fi

          SCHEME=$(xcodebuild -list -json -project "$XCODEPROJ" |
            python3 -c '
          import json, sys
          schemes = json.load(sys.stdin)["project"]["schemes"]
          if not schemes:
              raise SystemExit("No Xcode schemes found.")
          print(schemes[0])
          ')

          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/ios-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        shell: bash
        env:
          IOS_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail

          APP=$(find ios-build/Build/Products/Debug-iphoneos \
            -maxdepth 1 -name "*.app" -type d | head -n 1)

          if [ -z "$APP" ]; then
            echo "Compiled iOS app not found."
            exit 1
          fi

          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/

          IPA_NAME="Dewdrop_Dynasty_iOS_Build_${IOS_BUILD_NUMBER}.ipa"
          cd ipa
          zip -qr "$GITHUB_WORKSPACE/$IPA_NAME" Payload

          echo "Unsigned IPA created: $IPA_NAME"

      - name: Publish IPA to a private release in myprivaterepo
        uses: softprops/action-gh-release@v2
        with:
          repository: SlyDevil6858/myprivaterepo
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          tag_name: dewdrop-ios-build-${{ github.run_id }}
          name: Dewdrop Dynasty iOS Build ${{ inputs.build_number }}
          body: |
            Unsigned iOS build of Dewdrop Dynasty.

            Build number: ${{ inputs.build_number }}
            Support page: ${{ inputs.support_url }}

            This release is published privately in the Dewdrop Dynasty game repository.
          files: Dewdrop_Dynasty_iOS_Build_${{ inputs.build_number }}.ipa
          fail_on_unmatched_files: true
          make_latest: false
