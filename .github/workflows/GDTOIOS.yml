name: Build Unsigned iOS IPA using GODOT game!

on:
  workflow_dispatch:
    inputs:
      game_repository:
        description: "Private game repository (owner/repository)"
        required: true
        default: "SlyDevil6858/myprivaterepo"
        type: string
      game_folder:
        description: "Folder containing the game EXE/PCK"
        required: true
        default: "PC/game/Dewdrop.Dynasty/DewdropDynasty_Windows"
        type: string

permissions:
  contents: read

jobs:
  recover:
    name: Recover Godot Project
    runs-on: windows-latest

    outputs:
      godot_minor: ${{ steps.version.outputs.godot_minor }}

    steps:
      - name: Download private game repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.game_repository }}
          token: ${{ secrets.GAME_REPO_TOKEN }}
          lfs: true
          path: game-source

      - name: Install GDRE Tools
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod https://get.scoop.sh | Invoke-Expression
          scoop bucket add games
          scoop install gdsdecomp

      - name: Locate game files
        id: game
        shell: pwsh
        run: |
          $source = Join-Path "game-source" "${{ inputs.game_folder }}"

          if (!(Test-Path $source)) {
            throw "Game folder not found: $source"
          }

          $pck = Get-ChildItem $source -Filter "*.pck" -Recurse |
            Select-Object -First 1

          $exe = Get-ChildItem $source -Filter "*.exe" -Recurse |
            Select-Object -First 1

          if ($pck) {
            "INPUT_FILE=$($pck.FullName)" >> $env:GITHUB_OUTPUT
          }
          elseif ($exe) {
            "INPUT_FILE=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          }
          else {
            throw "No EXE or PCK found."
          }

          if ($exe) {
            "EXE_FILE=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          }

      - name: Install gore
        shell: pwsh
        run: |
          $release = Invoke-RestMethod "https://api.github.com/repos/figurophobia/gore/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -eq "windows-x86_64.zip" } | Select-Object -First 1

          if (!$asset) {
            throw "Could not find the Windows x86_64 gore release asset."
          }

          $installDir = Join-Path $env:RUNNER_TEMP "gore"
          New-Item -ItemType Directory -Force $installDir | Out-Null

          $archive = Join-Path $env:RUNNER_TEMP "gore.zip"
          Invoke-WebRequest $asset.browser_download_url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $installDir -Force

          $gore = Get-ChildItem $installDir -Filter "gore.exe" -Recurse |
            Select-Object -First 1

          if (!$gore) {
            throw "gore.exe was not found in the downloaded release."
          }

          "GORE_EXE=$($gore.FullName)" >> $env:GITHUB_ENV
          Write-Host "Installed gore $($release.tag_name)"

      - name: Recover and decrypt Godot project with gore
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force recovered | Out-Null

          $gdre = Join-Path $env:USERPROFILE "scoop\shims\gdre_tools.exe"
          if (!(Test-Path $gdre)) {
            throw "GDRE Tools executable not found at $gdre"
          }

          if (!(Test-Path $env:GORE_EXE)) {
            throw "gore executable not found at $env:GORE_EXE"
          }

          # gore searches the selected EXE/PCK for the embedded encryption key.
          # The key itself is not passed as an argument or written to the logs.
          & $env:GORE_EXE recover "${{ steps.game.outputs.INPUT_FILE }}" -o "$env:GITHUB_WORKSPACE\recovered" --gdre "$gdre"

          if ($LASTEXITCODE -ne 0) {
            throw "gore recovery failed with exit code $LASTEXITCODE."
          }

          if (!(Test-Path "recovered/project.godot")) {
            throw "gore did not produce recovered/project.godot."
          }

      - name: Extract original EXE icon
        if: steps.game.outputs.EXE_FILE != ''
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing

          $exePath = "${{ steps.game.outputs.EXE_FILE }}"
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exePath)

          if ($null -eq $icon) {
            throw "Could not extract the EXE icon."
          }

          $sourceBitmap = $icon.ToBitmap()

          $bitmap = New-Object System.Drawing.Bitmap(
            1024, 1024,
            [System.Drawing.Imaging.PixelFormat]::Format32bppArgb
          )

          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.Clear([System.Drawing.Color]::Transparent)
          $graphics.InterpolationMode = "HighQualityBicubic"
          $graphics.SmoothingMode = "HighQuality"
          $graphics.PixelOffsetMode = "HighQuality"

          $size = [Math]::Min($sourceBitmap.Width, $sourceBitmap.Height)
          $x = [int](($sourceBitmap.Width - $size) / 2)
          $y = [int](($sourceBitmap.Height - $size) / 2)

          $graphics.DrawImage(
            $sourceBitmap,
            [System.Drawing.Rectangle]::new(96, 96, 832, 832),
            [System.Drawing.Rectangle]::new($x, $y, $size, $size),
            [System.Drawing.GraphicsUnit]::Pixel
          )

          $bitmap.Save(
            "$env:GITHUB_WORKSPACE\recovered\icon.png",
            [System.Drawing.Imaging.ImageFormat]::Png
          )

          $graphics.Dispose()
          $bitmap.Dispose()
          $sourceBitmap.Dispose()
          $icon.Dispose()

          Write-Host "EXE icon extracted to recovered/icon.png"

      - name: Set recovered project icon
        if: steps.game.outputs.EXE_FILE != ''
        shell: pwsh
        run: |
          $project = "recovered/project.godot"
          $lines = [System.Collections.Generic.List[string]]::new()

          (Get-Content $project) | ForEach-Object {
            $lines.Add($_)
          }

          $start = $lines.IndexOf("[application]")

          if ($start -lt 0) {
            $lines.Add("")
            $lines.Add("[application]")
            $start = $lines.Count - 1
          }

          $end = $lines.Count

          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^\[') {
              $end = $i
              break
            }
          }

          $found = $false

          for ($i = $start + 1; $i -lt $end; $i++) {
            if ($lines[$i] -match '^config/icon=') {
              $lines[$i] = 'config/icon="res://icon.png"'
              $found = $true
              break
            }
          }

          if (!$found) {
            $lines.Insert($start + 1, 'config/icon="res://icon.png"')
          }

          Set-Content $project $lines -Encoding utf8

      - name: Add iOS export preset
        shell: pwsh
        run: |
          $preset = "game-source/ios-config/export_presets.cfg"

          if (!(Test-Path $preset)) {
            throw "Missing ios-config/export_presets.cfg in game repository."
          }

          Copy-Item $preset "recovered/export_presets.cfg"

      - name: Detect Godot version series
        id: version
        shell: pwsh
        run: |
          $project = Get-Content "recovered/project.godot" -Raw

          $match = [regex]::Match(
            $project,
            'config/features\s*=\s*PackedStringArray\("(\d+\.\d+)'
          )

          if (!$match.Success) {
            throw "Could not detect Godot version series from project.godot."
          }

          $minor = $match.Groups[1].Value

          if (!$minor.StartsWith("4.")) {
            throw "This workflow currently supports Godot 4.x only. Detected $minor."
          }

          "godot_minor=$minor" >> $env:GITHUB_OUTPUT

      - name: Upload recovered project
        uses: actions/upload-artifact@v4
        with:
          name: recovered-godot-project
          path: recovered/
          if-no-files-found: error
          retention-days: 7

  build-ios:
    name: Build Unsigned iOS IPA
    needs: recover
    runs-on: xcode-27

    steps:
      - name: Download recovered project
        uses: actions/download-artifact@v4
        with:
          name: recovered-godot-project
          path: recovered

      - name: Install matching Godot version and templates
        shell: bash
        run: |
          set -euo pipefail

          MINOR="${{ needs.recover.outputs.godot_minor }}"

          RELEASES=$(curl -fsSL \
            "https://api.github.com/repos/godotengine/godot/releases?per_page=100")

          VERSION=$(echo "$RELEASES" | python3 -c '
          import json, sys

          minor = sys.argv[1]
          releases = json.load(sys.stdin)

          matches = [
              r["tag_name"].removesuffix("-stable")
              for r in releases
              if r.get("tag_name", "").startswith(minor + ".")
              and r.get("tag_name", "").endswith("-stable")
              and not r.get("prerelease", False)
          ]

          if not matches:
              raise SystemExit("No stable release found for " + minor)

          print(max(matches, key=lambda v: tuple(int(part) for part in v.split("."))))
          ' "$MINOR")

          BASE="https://github.com/godotengine/godot/releases/download/${VERSION}-stable"

          curl -fL "$BASE/Godot_v${VERSION}-stable_macos.universal.zip" \
            -o godot.zip

          curl -fL "$BASE/Godot_v${VERSION}-stable_export_templates.tpz" \
            -o templates.tpz

          unzip -q godot.zip -d godot-app
          unzip -q templates.tpz -d templates

          GODOT_APP=$(find godot-app -name "Godot.app" -type d | head -n 1)

          if [ -z "$GODOT_APP" ]; then
            echo "Godot.app not found."
            exit 1
          fi

          GODOT_BIN="$GODOT_APP/Contents/MacOS/Godot"

          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/${VERSION}.stable"

          mkdir -p "$TEMPLATE_DIR"
          cp -R templates/templates/. "$TEMPLATE_DIR/"

          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          echo "GODOT_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Configure unsigned iOS export
        shell: bash
        env:
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          if [ -z "$IOS_BUNDLE_ID" ]; then
            echo "Set the IOS_BUNDLE_ID repository secret."
            exit 1
          fi

          python3 - <<'PY'
          import os, re
          from pathlib import Path

          path = Path("recovered/export_presets.cfg")
          text = path.read_text(encoding="utf-8")

          def replace_setting(text, key, value):
              pattern = rf'(?m)^{re.escape(key)}=.*$'
              replacement = f'{key}="{value}"'
              if re.search(pattern, text):
                  return re.sub(pattern, lambda _: replacement, text)
              return text

          text = replace_setting(
              text,
              "application/bundle_identifier",
              os.environ["IOS_BUNDLE_ID"]
          )

          team_id = os.environ.get("APPLE_TEAM_ID", "")
          if team_id:
              text = replace_setting(
                  text,
                  "application/app_store_team_id",
                  team_id
              )

          # Use the recovered EXE icon through Godot's project icon fallback.
          text = re.sub(
              r'(?m)^(icons/[^=]+)=.*$',
              r'\1=""',
              text
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail

          "$GODOT_BIN" \
            --headless \
            --editor \
            --path "$GITHUB_WORKSPACE/recovered" \
            --import

      - name: Export iOS Xcode project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ios-export

          "$GODOT_BIN" \
            --headless \
            --path "$GITHUB_WORKSPACE/recovered" \
            --export-debug "iOS" \
            "$GITHUB_WORKSPACE/ios-export/Game.zip"

          if [ ! -f ios-export/Game.zip ]; then
            echo "Godot did not create the iOS export ZIP."
            exit 1
          fi

          mkdir -p ios-export/project
          unzip -q ios-export/Game.zip -d ios-export/project

      - name: Compile without code signing
        shell: bash
        run: |
          set -euo pipefail

          XCODEPROJ=$(find ios-export/project \
            -name "*.xcodeproj" -type d | head -n 1)

          if [ -z "$XCODEPROJ" ]; then
            echo "Xcode project not found."
            exit 1
          fi

          SCHEME=$(xcodebuild -list -json -project "$XCODEPROJ" |
            python3 -c '
          import json, sys
          schemes = json.load(sys.stdin)["project"]["schemes"]
          if not schemes:
              raise SystemExit("No Xcode schemes found.")
          print(schemes[0])
          ')

          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/ios-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP=$(find ios-build/Build/Products/Debug-iphoneos \
            -maxdepth 1 -name "*.app" -type d | head -n 1)

          if [ -z "$APP" ]; then
            echo "Compiled iOS app not found."
            exit 1
          fi

          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/

          cd ipa
          zip -qr "$GITHUB_WORKSPACE/Game-unsigned.ipa" Payload

          echo "Unsigned IPA created successfully."

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ios-ipa
          path: Game-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
